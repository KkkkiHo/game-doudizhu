<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鬥地主</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {

  .wrap { width: min(96vw, 460px); }

  #table { display: flex; gap: 6px; margin: 4px 0 8px; min-height: 96px; }

  .card .r { position: absolute; top: 3px; left: 4px; font-size: 15px; line-height: 1; }
  .card .s { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-size: 20px; }
  .card .r2 { position: absolute; bottom: 3px; right: 4px; font-size: 15px; line-height: 1; transform: rotate(180deg); }

    .play-cards .card { margin-left: -16px; }
  }
  .note { margin-top: 10px; font-size: 12px; color: #81c784; text-align: center; }

</head>

  <header>
    <div>
      <h1>鬥地主</h1>

  <p class="note">三個人玩，一個地主對兩個農民。牌型同規矩跟一般鬥地主：單張、對子、三條、順子、連對、飛機、炸彈、王炸。</p>
</div>
<div id="overlay">
  <div class="box">
    <p class="big" id="overlay-title"></p>
    <p class="sub" id="overlay-sub"></p>
    <div id="overlay-buttons"></div>
  </div>
</div>
<script>
"use strict";
/* ---------- Cards ---------- */

  var deck = [], id = 0, r, s;
  for (r = 3; r <= 15; r++) for (s = 0; s < 4; s++) deck.push({ id: id++, rank: r, suit: s });

}

  var g = groupByRank(sorted);
  var ranks = Object.keys(g).map(Number).sort(function (a, b) { return a - b; });

  function rankWithCount(k) { var out = []; ranks.forEach(function (r) { if (g[r].length === k) out.push(r); }); return out; }

  if (n === 4 && ranks.length === 1) return comboOf("bomb", ranks[0], sorted);

  if (n === 3 && ranks.length === 1) return comboOf("triple", ranks[0], sorted);

  if (b.type === "bomb") return false;

function comboName(c) {

/* ---------- AI candidate generation ---------- */

    $("mult").textContent = String(G.mult);
  }
  function setActions(list) {
    var box = $("actions");
    box.innerHTML = "";
    list.forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = b.label;
      if (b.primary) btn.className = "primary";
      if (b.disabled) btn.disabled = true;
      if (b.onClick) btn.addEventListener("click", b.onClick);
      box.appendChild(btn);
    });
  }
  function showOverlay(title, sub, label, onClick) {
    $("overlay-title").textContent = title;
    $("overlay-sub").textContent = sub;
    var box = $("overlay-buttons");
    box.innerHTML = "";
    var btn = document.createElement("button");
    btn.type = "button"; btn.textContent = label;
    btn.addEventListener("click", function () { $("overlay").classList.remove("show"); onClick(); });
    box.appendChild(btn);
    $("overlay").classList.add("show");
  }
  function newGame() {
    gameId++;
    var dealt = dealHands(makeDeck(), luckyMode);
    G = {
      phase: "bidding", hands: dealt.hands, bottom: dealt.bottom, bottomShown: false,
      landlord: -1, current: 0, lastCombo: null, lastPlayer: -1, passCount: 0,
      lastPlays: [null, null, null], mult: 1, bombCount: 0,
      plays: { L: 0, P: 0 }, bid: 0, bidIdx: 0, bidPasses: 0, lastBidder: -1, seen: {}
    };
    selected = {};
    renderBottom(); renderHand(); renderPlays();
    setStatus("輪到你叫地主：叫就做地主，唔叫就睇對手。");
    biddingUI();
  }
  function biddingUI() {
    if (G.phase !== "bidding") return;
    var me = G.bidIdx;
    if (me === 0 && !autoMode) {
      if (G.bid === 0) {
        setActions([
          { label: "叫地主", primary: true, onClick: function () { applyBid(0, 1); } },
          { label: "不叫", onClick: function () { applyBid(0, 0); } }
        ]);
        setStatus("輪到你：叫地主定唔叫？");
      } else {
        var list = [{ label: "不搶", onClick: function () { applyBid(0, 0); } }];
        for (var v = G.bid + 1; v <= 3; v++) {
          (function (val) { list.unshift({ label: "搶地主 " + val + " 分", primary: true, onClick: function () { applyBid(0, val); } }); })(v);
        }
        setActions(list);
        setStatus("而家 " + G.bid + " 分，輪到你：搶定唔搶？");
      }
    } else {
      var whoName = me === 0 ? "托管" : NAMES[me];
      setActions([{ label: "等緊 " + whoName + " 叫牌…", disabled: true }]);
      setStatus("等緊 " + whoName + " 叫牌…");
      var token = gameId, atoken = autoToken;
      setTimeout(function () {
        if (token !== gameId || G.phase !== "bidding" || G.bidIdx !== me) return;
        if (me === 0 && (!autoMode || atoken !== autoToken)) return;
        applyBid(me, autoBidValue(G.hands[me], G.bid));
      }, 750 + Math.random() * 500);
    }
  }
  function applyBid(player, val) {
    if (G.phase !== "bidding") return;
    if (val > 0) {
      G.bid = val; G.lastBidder = player; G.bidPasses = 0;
      setStatus(NAMES[player] + " 叫咗 " + val + " 分。");
      if (val === 3) { finishBidding(); return; }
    } else {
      G.bidPasses++;
      setStatus(NAMES[player] + " 唔叫。");
      if (G.bid > 0 && G.bidPasses >= 2) { finishBidding(); return; }
      if (G.bid === 0 && G.bidPasses >= 3) {
        showOverlay("冇人叫地主", "三個人都唔叫，重新發牌。", "重新發牌", newGame);
        return;
      }
    }
    G.bidIdx = (G.bidIdx + 1) % 3;
    renderPlays();
    biddingUI();
  }
  function finishBidding() {
    G.landlord = G.lastBidder;
    G.hands[G.landlord] = G.hands[G.landlord].concat(G.bottom);
    sortHand(G.hands[G.landlord]);
    G.bottomShown = true;
    G.phase = "playing";
    G.current = G.landlord;
    G.lastCombo = null; G.lastPlayer = -1; G.passCount = 0;
    renderBottom(); renderHand(); renderPlays();
    setStatus(NAMES[G.landlord] + " 做地主，底牌已經派咗俾佢。");
    startTurn();
  }
  function ctxFor(player) {
    var counts = [G.hands[0].length, G.hands[1].length, G.hands[2].length];
    var unseen = [4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 1, 1];
    G.hands[player].forEach(function (c) { unseen[c.rank - 3]--; });
    Object.keys(G.seen || {}).forEach(function (r) { unseen[r - 3] -= G.seen[r]; });
    unseen = unseen.map(function (v) { return Math.max(0, v); });
    return {
      last: G.lastCombo, lastPlayer: G.lastPlayer, landlord: G.landlord, me: player,
      lastPlayerCards: G.lastPlayer >= 0 ? G.hands[G.lastPlayer].length : undefined,
      counts: counts, unseen: unseen
    };
  }
  function startTurn() {
    if (G.phase !== "playing") return;
    renderPlays(); renderHand();
    if (G.current === 0 && autoMode) {
      setActions([{ label: "托管中，電腦幫你出牌…", disabled: true }]);
      setStatus("托管中，電腦幫你出牌…");
      var token2 = gameId, atoken2 = autoToken;
      setTimeout(function () {
        if (token2 !== gameId || atoken2 !== autoToken || !autoMode || G.phase !== "playing" || G.current !== 0) return;
        selected = {};
        var cards = choosePlay(G.hands[0], ctxFor(0));
        if (cards && cards.length) playCards(0, cards);
        else passPlay(0);
      }, 800 + Math.random() * 500);
    } else if (G.current === 0) {
      if (!G.lastCombo) {
        setActions([
          { label: "提示", onClick: hintPlay },
          { label: "重選", onClick: function () { selected = {}; renderHand(); setStatus("已清除揀咗嘅牌。"); } },
          { label: "出牌", primary: true, onClick: userPlay }
        ]);
        setStatus("輪到你出牌，撳牌揀牌。");
      } else {
        setActions([
          { label: "不出", onClick: userPass },
          { label: "提示", onClick: hintPlay },
          { label: "重選", onClick: function () { selected = {}; renderHand(); setStatus("已清除揀咗嘅牌。"); } },
          { label: "出牌", primary: true, onClick: userPlay }
        ]);
        setStatus("上家出咗「" + comboName(G.lastCombo) + "」，輪到你：跟定唔出？");
      }
    } else {
      setActions([{ label: "等緊 " + NAMES[G.current] + " 出牌…", disabled: true }]);
      setStatus("等緊 " + NAMES[G.current] + " 出牌…");
      var token = gameId, who = G.current;
      setTimeout(function () {
        if (token !== gameId || G.phase !== "playing" || G.current !== who) return;
        var cards = choosePlay(G.hands[who], ctxFor(who));
        if (cards && cards.length) playCards(who, cards);
        else passPlay(who);
      }, 800 + Math.random() * 500);
    }
  }
  function selectedCards() {
    return G.hands[0].filter(function (c) { return selected[c.id]; });
  }
  function userPlay() {
    var cards = selectedCards();
    if (!cards.length) { setStatus("未揀牌，撳幾張牌先。"); return; }
    var c = analyze(cards);
    if (!c) { setStatus("呢副牌唔係合法牌型，撳「提示」試下。"); return; }
    if (G.lastCombo && !beats(c, G.lastCombo)) { setStatus("大唔過上家嘅「" + comboName(G.lastCombo) + "」。"); return; }
    selected = {};
    playCards(0, cards);
  }
  function userPass() {
    if (!G.lastCombo) { setStatus("輪到你帶頭出牌，唔可以唔出。"); return; }
    selected = {};
    passPlay(0);
  }
  function hintPlay() {
    var cards = choosePlay(G.hands[0], ctxFor(0));
    if (!cards) { setStatus("冇牌大得過上家，建議唔出。"); return; }
    selected = {};
    cards.forEach(function (c) { selected[c.id] = true; });
    renderHand();
    setStatus("已幫你揀好「" + comboName(analyze(cards)) + "」，撳「出牌」就得。");
  }
  function playCards(player, cards) {
    var ids = {};
    cards.forEach(function (c) { ids[c.id] = true; G.seen[c.rank] = (G.seen[c.rank] || 0) + 1; });
    G.hands[player] = G.hands[player].filter(function (c) { return !ids[c.id]; });
    var c = analyze(cards);
    G.lastCombo = c;
    G.lastPlayer = player;
    G.passCount = 0;
    G.lastPlays[player] = { cards: sortHand(cards.slice()), passed: false };
    G.plays[teamOf(player)]++;
    if (c.type === "bomb" || c.type === "rocket") { G.bombCount++; G.mult = Math.pow(2, G.bombCount); }
    setStatus(NAMES[player] + " 出咗「" + comboName(c) + "」。");
    if (G.hands[player].length === 0) { renderBottom(); renderHand(); renderPlays(); endGame(player); return; }
    G.current = (player + 1) % 3;
    renderBottom(); renderHand(); renderPlays();
    startTurn();
  }
  function passPlay(player) {
    G.lastPlays[player] = { passed: true };
    G.passCount++;
    setStatus(NAMES[player] + " 唔出。");
    if (G.passCount >= 2) {
      var lead = G.lastPlayer;
      G.lastCombo = null; G.lastPlayer = -1; G.passCount = 0;
      G.lastPlays = [null, null, null];
      G.current = lead;
      setStatus("大家都唔出，輪到 " + NAMES[lead] + " 重新帶頭。");
    } else {
      G.current = (player + 1) % 3;
    }
    renderPlays(); renderHand();
    startTurn();
  }
  function endGame(winner) {
    G.phase = "over";
    setActions([]);
    var winnerTeam = teamOf(winner);
    var spring = (winnerTeam === "L" && G.plays.P === 0) || (winnerTeam === "P" && G.plays.L === 1);
    if (spring) G.mult *= 2;
    renderPlays();
    var userWon = teamOf(0) === winnerTeam;
    var role = G.landlord === 0 ? "你做地主" : NAMES[G.landlord] + " 做地主";
    var detail = role + "。\n最後倍數 " + G.mult + " 倍" + (spring ? "（春天，倍數加倍）" : "") + "。\n地主出過 " + G.plays.L + " 次牌，農民出過 " + G.plays.P + " 次牌。";
    showOverlay(userWon ? "你贏咗！" : "你輸咗…", detail, "再玩一局", newGame);
  }
  $("lucky-btn").addEventListener("click", function () {
    luckyMode = !luckyMode;
    this.textContent = luckyMode ? "🍀 靚牌模式：開" : "🍀 靚牌模式：關";
    this.classList.toggle("on", luckyMode);
    if (G && G.phase === "bidding") {
      setStatus(luckyMode ? "靚牌模式已開，重新發牌…" : "靚牌模式已關，重新發牌…");
      newGame();
    } else {
      setStatus(luckyMode ? "靚牌模式已開，下一局生效。" : "靚牌模式已關，下一局回復正常發牌。");
    }
  });
  $("auto-btn").addEventListener("click", function () {
    autoMode = !autoMode;
    autoToken++;
    this.textContent = autoMode ? "🤖 托管：開" : "🤖 托管：關";
    this.classList.toggle("on", autoMode);
    if (!G) return;
    if (G.phase === "bidding" && G.bidIdx === 0) biddingUI();
    else if (G.phase === "playing" && G.current === 0) startTurn();
    else setStatus(autoMode ? "托管已開，輪到你嗰陣電腦會幫你出牌。" : "托管已關，輪到你嗰陣自己出牌。");
  });
  newGame();
}
</script>
